---

name: Date Time Printer

on:
  push:
    branches:
      - main
  schedule:
    - cron: #"*/5 * * * *"  # runs every 5 mintues

jobs:
  print-date-time:
    runs-on: Ubuntu-latest

    steps:
      - name: Print Current Date
        run: date

      - name: print Timezone
        run: timedatectl

      - name: Custom Message
        run: echo "Devops workflow printing date and time"
